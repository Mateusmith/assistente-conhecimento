name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes Java e PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validar projeto
        run: ./mvnw --batch-mode verify
      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

  container:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir imagem
        run: docker build --tag contextpilot:${{ github.sha }} .
