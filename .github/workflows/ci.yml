name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes Java e PostgreSQL real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configurar Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validar projeto
        run: ./mvnw --batch-mode verify
      - name: Publicar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Publicar relatorio adversarial
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-adversarial
          path: target/adversarial-report.json
          if-no-files-found: error

  container:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yml -f compose.ollama.yml config --quiet
      - name: Construir imagem
        run: docker build --tag assistente-conhecimento:${{ github.sha }} .
