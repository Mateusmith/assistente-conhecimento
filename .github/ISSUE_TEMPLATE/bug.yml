name: Relatar defeito
description: Comportamento incorreto ou regressao reproduzivel
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema observado
      description: Nao inclua tokens, chaves ou documentos privados.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      placeholder: Passos, entrada anonimizada e resultado obtido
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versao ou commit
    validations:
      required: true
