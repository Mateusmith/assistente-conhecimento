services:
  banco:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contextpilot}
      POSTGRES_USER: ${POSTGRES_USER:-contextpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contextpilot_local}
    ports:
      - "54326:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dados-banco:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "18084:8080"
    volumes:
      - ./docker/keycloak/contextpilot-realm.json:/opt/keycloak/data/import/contextpilot-realm.json:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-contextpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-contextpilot_storage_local}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - dados-objetos:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  antivirus:
    image: clamav/clamav:1.5.3
    ports:
      - "13310:3310"
    volumes:
      - dados-antivirus:/var/lib/clamav

  aplicacao:
    build: .
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://banco:5432/${POSTGRES_DB:-contextpilot}
      DATABASE_USER: ${POSTGRES_USER:-contextpilot}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-contextpilot_local}
      JWT_ISSUER_URI: http://localhost:18084/realms/contextpilot
      JWT_JWK_SET_URI: http://keycloak:8080/realms/contextpilot/protocol/openid-connect/certs
      CONTEXT_PILOT_PROVEDOR_IA: ${CONTEXT_PILOT_PROVEDOR_IA:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CONTEXT_PILOT_MODELO_CHAT: ${CONTEXT_PILOT_MODELO_CHAT:-gpt-5-mini}
      CONTEXT_PILOT_MODELO_EMBEDDING: ${CONTEXT_PILOT_MODELO_EMBEDDING:-text-embedding-3-small}
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-contextpilot}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-contextpilot_storage_local}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documentos}
      ANTIVIRUS_ENABLED: "true"
      ANTIVIRUS_HOST: antivirus
      ANTIVIRUS_PORT: 3310
      OCR_ENABLED: "true"
      OCR_LANGUAGES: ${OCR_LANGUAGES:-por+eng}
      OBSERVABILITY_USER: ${OBSERVABILITY_USER:-prometheus}
      OBSERVABILITY_PASSWORD: ${OBSERVABILITY_PASSWORD:-contextpilot_metrics_local}
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8083:8080"
    depends_on:
      banco:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy
      antivirus:
        condition: service_healthy
      zipkin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 8s
      timeout: 4s
      retries: 30
      start_period: 25s

  zipkin:
    image: openzipkin/zipkin:3.5.1
    ports:
      - "19411:9411"

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "19093:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      aplicacao:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_contextpilot}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "13003:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  dados-banco:
  dados-objetos:
  dados-antivirus:
