spring:
  config:
    import: optional:configtree:/run/secrets/
  application:
    name: assistente-conhecimento
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:54326/contextpilot}
    username: ${DATABASE_USER:contextpilot}
    password: ${database_password:${DATABASE_PASSWORD:contextpilot_local}}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 3000
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16383}
      timeout: ${REDIS_TIMEOUT:2s}
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}
      thread-name-prefix: contextpilot-worker-
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:18084/realms/contextpilot}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:18084/realms/contextpilot/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  ssl:
    enabled: ${TLS_ENABLED:false}
    certificate: ${TLS_CERTIFICATE:}
    certificate-private-key: ${TLS_PRIVATE_KEY:}

contextpilot:
  seguranca:
    tls-terminado-no-proxy: ${TLS_TERMINATED_AT_PROXY:false}
    audiencia-jwt: ${JWT_AUDIENCE:contextpilot-api}
  ia:
    provedor: ${CONTEXT_PILOT_PROVEDOR_IA:local}
    url-base: ${OPENAI_BASE_URL:https://api.openai.com}
    chave: ${openai_api_key:${OPENAI_API_KEY:}}
    modelo-chat: ${CONTEXT_PILOT_MODELO_CHAT:gpt-5-mini}
    modelo-embedding: ${CONTEXT_PILOT_MODELO_EMBEDDING:text-embedding-3-small}
    dimensoes: 384
    limite-tokens-resposta: 900
    custo-chat-entrada-milhao: ${AI_CHAT_INPUT_COST_PER_MILLION:0}
    custo-chat-saida-milhao: ${AI_CHAT_OUTPUT_COST_PER_MILLION:0}
    custo-embedding-milhao: ${AI_EMBEDDING_COST_PER_MILLION:0}
  documentos:
    tamanho-maximo-bytes: 10485760
    tamanho-trecho: 1200
    sobreposicao: 180
  armazenamento:
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:19000}
    regiao: ${OBJECT_STORAGE_REGION:us-east-1}
    chave-acesso: ${OBJECT_STORAGE_ACCESS_KEY:contextpilot}
    chave-secreta: ${object_storage_secret_key:${OBJECT_STORAGE_SECRET_KEY:contextpilot_storage_local}}
    bucket: ${OBJECT_STORAGE_BUCKET:documentos}
    acesso-por-caminho: ${OBJECT_STORAGE_PATH_STYLE:true}
    criar-bucket: ${OBJECT_STORAGE_CREATE_BUCKET:true}
    timeout: ${OBJECT_STORAGE_TIMEOUT:10s}
  antivirus:
    ativo: ${ANTIVIRUS_ENABLED:true}
    host: ${ANTIVIRUS_HOST:localhost}
    porta: ${ANTIVIRUS_PORT:13310}
    tamanho-bloco: 65536
    timeout-conexao: ${ANTIVIRUS_CONNECTION_TIMEOUT:3s}
    timeout-leitura: ${ANTIVIRUS_READ_TIMEOUT:30s}
  ocr:
    ativo: ${OCR_ENABLED:true}
    executavel: ${OCR_EXECUTABLE:tesseract}
    idiomas: ${OCR_LANGUAGES:por+eng}
    dpi: ${OCR_DPI:300}
    maximo-paginas: ${OCR_MAX_PAGES:20}
    timeout-por-pagina: ${OCR_PAGE_TIMEOUT:30s}
  busca:
    limite-fontes: 6
    pontuacao-minima: 0.12
    janela-contexto: ${SEARCH_CONTEXT_WINDOW:1}
    limite-ancoras: ${SEARCH_ANCHOR_LIMIT:3}
  privacidade-ia:
    proteger-dados-sensiveis-provedor-externo: ${AI_EXTERNAL_PII_PROTECTION:true}
  conversas:
    tempo-lease: ${CONVERSATION_LEASE_DURATION:5m}
    timeout-streaming: ${CONVERSATION_STREAM_TIMEOUT:90s}
    limite-mensagens-memoria: ${CONVERSATION_MEMORY_MESSAGES:8}
  avaliacoes:
    tempo-lease: ${EVALUATION_LEASE_DURATION:5m}
    intervalo-worker-ms: ${EVALUATION_WORKER_INTERVAL_MS:2000}
    atraso-inicial-ms: ${EVALUATION_WORKER_INITIAL_DELAY_MS:2000}
  governanca:
    redis-ativo: ${GOVERNANCE_REDIS_ENABLED:true}
    requisicoes-por-minuto: ${RATE_LIMIT_REQUESTS_PER_MINUTE:120}
    consultas-por-minuto: ${RATE_LIMIT_QUERIES_PER_MINUTE:30}
    janela-rate-limit: 1m
    sal-privacidade: ${privacy_pseudonym_salt:${PRIVACY_PSEUDONYM_SALT:change-me-outside-development}}
  cors:
    origens-permitidas: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  observabilidade:
    usuario: ${OBSERVABILITY_USER:prometheus}
    senha: ${observability_password:${OBSERVABILITY_PASSWORD:contextpilot_metrics_local}}

spring.ai.mcp.server:
  name: assistente-conhecimento-mcp
  version: 1.4.0
  type: SYNC
  protocol: STATELESS

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:${SERVER_PORT:8083}}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:19411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: contextpilot-swagger
      use-pkce-with-authorization-code-grant: true

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "
  level:
    root: INFO
    br.com.contextpilot: INFO
