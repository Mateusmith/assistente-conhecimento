route:
  receiver: registro-local
  group_by: [alertname, severidade]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: registro-local

inhibit_rules:
  - source_matchers: ['severidade="critica"']
    target_matchers: ['severidade=~"alta|media"']
    equal: [alertname]
