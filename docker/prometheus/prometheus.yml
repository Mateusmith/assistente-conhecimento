global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: contextpilot
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: contextpilot_metrics_local
    dns_sd_configs:
      - names: ["aplicacao"]
        type: A
        port: 8080
        refresh_interval: 10s
